  <main class="main-content" role="main">
    
    <!-- Hero Section - Inicio -->
    <section id="home" class="section hero-section-wrapper">
      <app-hero-section></app-hero-section>

    <!-- About Section - Sobre Mí -->

    <!-- Experience Section - Experiencia -->
    <section id="experience" class="section experience-section-wrapper">
      <app-experience-section></app-experience-section>
    </section>

    <!-- Projects Section - Proyectos -->
    <section id="projects" class="section projects-section-wrapper">
      <app-projects-section></app-projects-section>

    <!-- Skills Section - Competencias -->
